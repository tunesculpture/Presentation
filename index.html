<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Presentation Player</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@6.3.289/build/pdf.min.mjs" type="module"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pptxviewjs@1.1.9/dist/PptxViewJS.min.js"></script>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#05070c;color:#fff;font-family:system-ui,sans-serif;overflow:hidden}.join{height:100%;display:grid;place-items:center}.card{width:min(430px,92vw);padding:28px;background:#101522;border:1px solid #ffffff18;border-radius:24px}.card h1{margin:0 0 8px}.muted{color:#9ca7bb}input,button{width:100%;padding:14px;margin-top:10px;border-radius:12px;border:1px solid #ffffff18;background:#171d2a;color:#fff;font-size:16px}button{background:#fff;color:#080a10;font-weight:700}.err{color:#ff8d8d;margin-top:10px;min-height:20px}.stage{display:none;width:100%;height:100%;position:relative}.ppt{width:100%;height:100%;display:grid;place-items:center}.ppt canvas{max-width:100%;max-height:100%;width:auto;height:auto}.pdf canvas{max-width:100%;max-height:100%;object-fit:contain}.count{position:fixed;right:16px;bottom:12px;color:#7f8aa0;font-size:13px;z-index:5;background:#0007;padding:5px 8px;border-radius:8px}</style></head>
<body><div class="join" id="join"><div class="card"><h1>Presentation</h1><div class="muted">Enter the code and password shown in your phone.</div><input id="code" placeholder="Presentation code"><input id="pw" placeholder="Password" type="password"><button onclick="start()">Start presentation</button><div class="err" id="err"></div></div></div>
<div class="stage" id="stage"><div id="viewer" class="ppt"></div><div class="count" id="count"></div></div>
<script>
const URL="https://fcedxenugshdbkummqwh.supabase.co",KEY="sb_publishable_1iAmtkndyDOzHHwZgYglTg_5CnffByo",db=supabase.createClient(URL,KEY);
let p,channel,pptViewer,pdfDoc,pdfCanvases=[],pdfRendering=false;
async function start(){const c=code.value.trim().toUpperCase(),pw=pwEl().trim();const {data,error}=await db.from('presentations').select('*').eq('code',c).eq('password',pw).maybeSingle();if(error||!data){err.textContent="Invalid code or password.";return}p=data;join.style.display='none';stage.style.display='block';document.documentElement.requestFullscreen?.().catch(()=>{});await loadFile();channel=db.channel("presentation-"+p.id).on("postgres_changes",{event:"UPDATE",schema:"public",table:"presentations",filter:"id=eq."+p.id},async x=>{p=x.new;await showSlide()}).subscribe()}
function pwEl(){return document.getElementById("pw").value}
async function loadFile(){viewer.innerHTML="";pdfDoc=null;pptViewer=null;pdfCanvases=[];if(!p.file_url){viewer.innerHTML='<div class="muted">This presentation has no uploaded file.</div>';return}if(p.file_type==="pdf"){await loadPdf(p.file_url)}else if(p.file_type==="pptx"){const canvas=document.createElement("canvas");canvas.width=1600;canvas.height=900;viewer.appendChild(canvas);pptViewer=new PptxViewJS.PPTXViewer({canvas});await pptViewer.loadFile(p.file_url);await pptViewer.goToSlide(p.current_slide||0);await pptViewer.render()}else{viewer.innerHTML='<div class="muted">Unsupported file type.</div>'}updateCount()}
async function loadPdf(url){const lib=await import("https://cdn.jsdelivr.net/npm/pdfjs-dist@6.3.289/build/pdf.min.mjs");lib.GlobalWorkerOptions.workerSrc="https://cdn.jsdelivr.net/npm/pdfjs-dist@6.3.289/build/pdf.worker.min.mjs";pdfDoc=await lib.getDocument(url).promise;await showPdf(p.current_slide||0,lib)}
async function showPdf(i,lib){if(!pdfDoc)return;const page=await pdfDoc.getPage(i+1),vp=page.getViewport({scale:1});const maxW=innerWidth,maxH=innerHeight;const scale=Math.min(maxW/vp.width,maxH/vp.height);const v=page.getViewport({scale});viewer.innerHTML="";const c=document.createElement("canvas");c.width=v.width;c.height=v.height;viewer.appendChild(c);await page.render({canvasContext:c.getContext("2d"),viewport:v}).promise;updateCount()}
async function showSlide(){if(p.file_type==="pptx"&&pptViewer){await pptViewer.goToSlide(p.current_slide);await pptViewer.render();updateCount()}else if(p.file_type==="pdf"){const lib=await import("https://cdn.jsdelivr.net/npm/pdfjs-dist@6.3.289/build/pdf.min.mjs");await showPdf(p.current_slide,lib)}}
function updateCount(){const total=p.file_type==="pdf"?(pdfDoc?.numPages||0):(pptViewer?.getSlideCount?.()||"?");count.textContent=`${(p.current_slide||0)+1} / ${total}`}
window.addEventListener("resize",()=>{if(p?.file_type==="pdf")showSlide()});
document.addEventListener("keydown",async e=>{if(!p)return;if(e.key==="ArrowRight"||e.key==="PageDown")await move(1);if(e.key==="ArrowLeft"||e.key==="PageUp")await move(-1)});
async function move(d){const total=p.file_type==="pdf"?pdfDoc?.numPages:pptViewer?.getSlideCount?.();if(!total)return;const n=Math.max(0,Math.min(total-1,(p.current_slide||0)+d));await db.from("presentations").update({current_slide:n}).eq("id",p.id)}
</script></body></html>
