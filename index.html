<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Presentation Player</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Inter,system-ui,sans-serif;background:#05070c;color:#fff;overflow:hidden}
#join{height:100%;display:grid;place-items:center}.card{width:min(420px,92vw);padding:28px;border:1px solid #ffffff18;border-radius:24px;background:#101522;box-shadow:0 20px 80px #0008}.card h1{margin:0 0 8px;font-size:28px}.muted{color:#9ca7bb;margin-bottom:22px}input,button{width:100%;padding:14px 16px;border-radius:12px;border:1px solid #ffffff18;background:#171d2a;color:#fff;font-size:16px;margin-top:10px}button{background:#fff;color:#080a10;font-weight:700;cursor:pointer}.error{color:#ff8d8d;margin-top:12px;min-height:20px}
#stage{display:none;width:100%;height:100%;position:relative;background:#080b12}.slide{position:absolute;inset:0;display:none;padding:7vw;align-items:center;justify-content:center;text-align:center}.slide.active{display:flex}.content{max-width:1100px;width:100%}.title{font-size:clamp(38px,7vw,100px);font-weight:800;line-height:1.02;margin-bottom:22px}.body{font-size:clamp(20px,3vw,42px);color:#cbd3e1;line-height:1.35}.img{max-width:75vw;max-height:52vh;border-radius:24px;margin:24px auto;display:block;box-shadow:0 25px 80px #0008}.counter{position:fixed;right:20px;bottom:15px;color:#667085;font-size:13px;z-index:5}
.fade{animation:fade .65s ease both}.up{animation:up .65s cubic-bezier(.2,.8,.2,1) both}.zoom{animation:zoom .7s cubic-bezier(.2,.8,.2,1) both}.left{animation:left .65s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes up{from{opacity:0;transform:translateY(45px)}to{opacity:1;transform:none}}@keyframes zoom{from{opacity:0;transform:scale(.82)}to{opacity:1;transform:none}}@keyframes left{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
</style></head>
<body>
<div id="join"><div class="card"><h1>Presentation</h1><div class="muted">Enter the code and password from your phone.</div>
<input id="code" placeholder="Presentation code" autocomplete="off"><input id="pw" placeholder="Password" type="password">
<button onclick="join()">Start Presentation</button><div id="err" class="error"></div></div></div>
<div id="stage"><div id="slides"></div><div class="counter" id="counter"></div></div>
<script>
const URL="https://fcedxenugshdbkummqwh.supabase.co";
const KEY="sb_publishable_1iAmtkndyDOzHHwZgYglTg_5CnffByo";
const db=supabase.createClient(URL,KEY);let p,channel;
async function join(){
 const code=document.getElementById('code').value.trim().toUpperCase(), pw=document.getElementById('pw').value.trim();
 const {data,error}=await db.from('presentations').select('*').eq('code',code).eq('password',pw).maybeSingle();
 if(error||!data){document.getElementById('err').textContent="Invalid code or password.";return}
 p=data;render();document.getElementById('join').style.display='none';document.getElementById('stage').style.display='block';
 document.documentElement.requestFullscreen?.().catch(()=>{});
 channel=db.channel('presentation-'+p.id).on('postgres_changes',{event:'UPDATE',schema:'public',table:'presentations',filter:'id=eq.'+p.id},x=>{p=x.new;render()}).subscribe();
}
function render(){
 const slides=Array.isArray(p.slide_data)?p.slide_data:[];const root=document.getElementById('slides');root.innerHTML='';
 slides.forEach((s,i)=>{const el=document.createElement('section');el.className='slide '+(i===p.current_slide?'active':'');
 const anim=s.animation||'up';el.innerHTML='<div class="content '+anim+'"><div class="title"></div><div class="body"></div></div>';
 el.querySelector('.title').textContent=s.title||'';el.querySelector('.body').textContent=s.body||'';
 if(s.image){const im=document.createElement('img');im.className='img';im.src=s.image;el.querySelector('.content').appendChild(im)}
 root.appendChild(el)});
 document.getElementById('counter').textContent=slides.length?`${p.current_slide+1} / ${slides.length}`:'No slides';
}
document.addEventListener('keydown',e=>{if(!p)return;if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault()}if(e.key==='ArrowRight'||e.key==='PageDown')remoteUpdate(Math.min(p.current_slide+1,(p.slide_data?.length||1)-1));if(e.key==='ArrowLeft'||e.key==='PageUp')remoteUpdate(Math.max(p.current_slide-1,0));});
async function remoteUpdate(n){await db.from('presentations').update({current_slide:n,current_animation:0}).eq('id',p.id);p.current_slide=n;render()}
</script></body></html>
